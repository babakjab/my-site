<h1>Drowned by Measure</h1>

<p><strong>By Babak Jabbar Nezhad</strong></p>



<div class="poem">

Slogans, slogans, slogans

Boxes, boxes, boxes


More, more, and more


How much?

How far?


You gained or you lost?


Nothing —

you drowned.


</div>
